name: build-snap
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            suffix: ""
          - runner: ubuntu-26.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot squashfs-tools
      - name: Set up LXD (mirrors snapcore/action-build)
        run: |
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          sudo snap install lxd
          sudo lxd init --auto
          # GH runners ship docker/moby, whose FORWARD DROP policy breaks
          # LXD bridge networking ("no network access" while creating the
          # build instance) - see snapcore/action-build ensureLXDNetwork.
          sudo iptables -P FORWARD ACCEPT
      - name: Build accountsservice snap
        run: |
          sudo snap install snapcraft --classic --channel=edge
          # Re-exec with fresh group membership so snapcraft can talk to
          # the LXD socket (see action-build's sudo -u "$USER" pattern).
          # No -E and no step env: sudo in the 26.04 runner image ignores
          # -E ("preserving the entire environment is not supported"), so
          # build-github.sh derives the arch suffix from the packed snap.
          sudo -u "$USER" ./build-github.sh
      - name: Publish to desktop-26-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-26-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create desktop-26-latest -R "$GITHUB_REPOSITORY" \
                 --title "desktop/26 latest snap" \
                 --notes "Rolling latest main snap build; assets are replaced on every green build."
          gh release upload desktop-26-latest "accountsservice${{ matrix.suffix }}.snap" -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: snap${{ matrix.suffix }}
          path: "accountsservice${{ matrix.suffix }}.snap"
          compression-level: 0
          retention-days: 14

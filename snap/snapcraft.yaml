name: accountsservice
base: core26-desktop
adopt-info: accountsservice
summary: AccountsService D-Bus system daemon as a provider snap
description: |
  The AccountsService system daemon (org.freedesktop.Accounts) packaged as
  a provider snap for Ubuntu Core Desktop. Staged from the same resolute
  accountsservice build the fat base shipped (PPA build with extrausers
  support: the daemon edits /var/lib/extrausers directly and execs the
  host's adduser/chpasswd helpers).

  The daemon is strictly confined: its slot policy lives in the snapd fork's
  `accountsservice` interface (extrausers rw, host helper execs, peer-less
  dbus receive rules); clients connect through that interface's plug or the
  built-in account-control plug.

  The daemon's user-management helpers are staged here (proper archive
  debs, not vendored files): the daemon execs its compiled-in absolute
  helper paths (/usr/sbin/adduser, /usr/sbin/chpasswd, /usr/sbin/usermod,
  ...), and a snap app's /usr is its BASE rootfs — the desktop-variant
  base carries no adduser/perl (they belong to the consumer), so the
  layouts below serve the snap-staged helpers at the daemon's compiled-in
  paths inside its namespace. /usr/sbin/chpasswd and /usr/sbin/usermod
  still resolve from the variant base (chpasswd: the base bakes the
  1017 extrausers-fallback build; usermod: the archive shadow build is
  extrausers-aware).

grade: stable
confinement: strict

slots:
  # Activation + name ownership: snapd writes the
  # /var/lib/snapd/dbus-1/system-services entry and the /etc/dbus-1/system.d
  # conf (root may own org.freedesktop.Accounts) for this slot; the app
  # activates on it.
  accounts-dbus:
    interface: dbus
    bus: system
    name: org.freedesktop.Accounts
  # Interface-specific policy slot (extrausers/helpers/dbus receive), defined
  # in the snapd fork.
  accountsservice:
    interface: accountsservice

plugs:
  # polkit authorization for the daemon's privileged operations; the action
  # XML is delivered to /usr/share/polkit-1/actions on connection.
  polkit:
    action-prefix: org.freedesktop.accounts

apps:
  accounts-daemon:
    command: usr/libexec/accounts-daemon
    daemon: dbus
    daemon-scope: system
    activates-on:
      - accounts-dbus
    plugs:
      - polkit
    slots:
      - accountsservice

layout:
  # The daemon resolves its compiled-in /usr/share/accountsservice path for
  # user-templates and interfaces/; those files ship inside this snap.
  /usr/share/accountsservice:
    bind: $SNAP/usr/share/accountsservice
  # The daemon keeps its state (cached user metadata, face icons) at its
  # compiled-in /var/lib/AccountsService path. That path cannot be served
  # from the host: snap-confine builds snap mount namespaces from the base
  # rootfs plus a fixed whitelist of host mounts, and /var/lib/AccountsService
  # is neither in the base nor on the whitelist (binding a host mount whose
  # mountpoint is absent from the base tree aborts snap-confine). Bind the
  # snap's own writable $SNAP_COMMON there instead; the fstab-seeded host
  # /var/lib/AccountsService on the desktop variant stays as inert factory
  # seeding for anything outside the snap.
  /var/lib/AccountsService:
    bind: $SNAP_COMMON
  # SetPassword record-injection guard: the daemon execs its compiled-in
  # /usr/sbin/chpasswd and pipes one "user:crypt\n" record to it without
  # validating the caller-supplied crypt for record separators, so a crypt of
  # "hash\notheruser:otherhash" would make chpasswd change a second
  # extrausers account in the same authorized call. Bind the validating guard
  # (chpasswd/chpasswd-guard.c) over that path in the daemon's namespace: it
  # accepts exactly one username:$<scheme>$salt$hash record (any modular-crypt scheme), rejects anything else
  # with exit 2 (the daemon surfaces chpasswd failures), then execs the snap's
  # byte-identical copy of the base's 1017-patched chpasswd
  # (usr/sbin/chpasswd.real — the per-arch build of the same patched source;
  # see the chpasswd-guard part below), so the extrausers fallback chain is
  # unchanged on every architecture.
  # No policy change needed: the fork's slot rule `/{,usr/}sbin/chpasswd ixr`
  # covers the guard exec (AppArmor mediates on the namespace path), and the
  # base template's exec grant on the snap's own install dir covers
  # chpasswd.real.
  /usr/sbin/chpasswd:
    bind-file: $SNAP/usr/sbin/chpasswd
  # CreateUser: the daemon execs its compiled-in /usr/sbin/adduser (a perl
  # script). Stage the archive adduser + perl-base debs and serve them at
  # the compiled-in paths (bind-file keeps the namespace path identical to
  # what the fork's slot policy grants: `/usr/sbin/adduser ixr`,
  # `/usr/bin/perl ixr`, `/usr/share/perl{,5}/** r`, `/etc/adduser.conf r`;
  # the perl-base modules under /usr/lib/.../perl-base are covered by the
  # base template's library read grant, as proven while adduser came from
  # the base). snap-update-ns creates missing file mountpoints (MkfileAll +
  # writable mimic), so binding over paths the base does not carry is safe.
  /usr/sbin/adduser:
    bind-file: $SNAP/usr/sbin/adduser
  /usr/bin/perl:
    bind-file: $SNAP/usr/bin/perl
  # $SNAP/usr/lib/<triplet>/perl-base: the triplet is the build arch's own
  # (perl's compiled-in @INC names the triplet dir), so the variable form is
  # required — snapcraft expands $CRAFT_ARCH_TRIPLET_BUILD_FOR in layouts at
  # pack time (x86_64-linux-gnu on amd64, aarch64-linux-gnu on arm64).
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl-base:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl-base
  /usr/share/perl5:
    bind: $SNAP/usr/share/perl5
  # adduser reads /etc/adduser.conf for the extrausers switch; the daemon
  # does not pass --extrausers on the command line (compiled-in argv is
  # "adduser --quiet --disabled-password --gecos <fullname> <name>"), so
  # USE_EXTRAUSERS=1 in the config is what routes accounts into
  # /var/lib/extrausers. The base no longer ships a config file.
  /etc/adduser.conf:
    bind-file: $SNAP/etc/adduser.conf

parts:
  accountsservice:
    plugin: nil
    stage-packages:
      - accountsservice
      - libnss-extrausers
      # The daemon's CreateUser helper and its perl runtime, staged as
      # proper archive debs (the base no longer carries them — the base
      # must not ship perl; dependencies belong to the consumer snap).
      # adduser needs only perl-base (all the modules it uses — Fcntl,
      # Getopt::Long, parent, Exporter — ship in perl-base; its
      # Debian::Adduser*.pm ship inside the adduser deb itself).
      - adduser
      - perl-base
    override-build: |
      craftctl default
      deb_dir="/root/parts/accountsservice/stage_packages"
      craftctl set version="$(dpkg-deb -f "$deb_dir"/accountsservice_*.deb Version)"
      # The archive adduser deb needs one small patch to work in
      # USE_EXTRAUSERS mode. Provenance: this is exactly the patch the fat
      # base carried (md5 430f8d1d23c460e795eb7181c4503365) and which the
      # desktop variant baked at variants/desktop/static/usr/sbin/adduser
      # until the payload moved here; it originates from the Ubuntu Core
      # Desktop adduser work (the ucd-ppa adduser 3.153ubuntu1+ucd1 build
      # took a different, stricter approach that was NOT what the fat base
      # shipped). Two hunks, both validated live on the desktop image:
      # 1. AddUserToGroup: the archive script passes --extrausers to
      #    usermod, but usermod has no such flag (usage text, exit 2) —
      #    the archive shadow build is extrausers-aware on its own and
      #    edits /var/lib/extrausers/group for extrausers users, so plain
      #    usermod is correct.
      # 2. ch_comment (the daemon ALWAYS passes --gecos to adduser, so
      #    this runs on every CreateUser): the archive script log_fatals
      #    in extrausers mode, which would fail/cripple every CreateUser
      #    ("refusing here silently dropped the real name set by the
      #    first-boot wizard") — plain usermod -c is correct for the same
      #    reason as hunk 1.
      # Guards (same policy as the chpasswd.real guard below): refuse to
      # pack if the staged adduser is not the archive build we patched
      # against, and refuse if the patched result is not byte-identical
      # to the live-validated fat-chain script.
      staged_md5="$(md5sum "$CRAFT_PART_INSTALL/usr/sbin/adduser" | cut -d' ' -f1)"
      if [ "$staged_md5" != "8eb21b6d428cd5c78ab6667bdd46284e" ]; then
        echo "staged adduser md5 $staged_md5 != expected 8eb21b6d428cd5c78ab6667bdd46284e" \
             "(archive adduser 3.153ubuntu1 — re-validate the patch below)" >&2
        exit 1
      fi
      patch -d "$CRAFT_PART_INSTALL" -p1 \
        < "${CRAFT_PROJECT_DIR}/patches/adduser-extrausers-usermod.patch"
      patched_md5="$(md5sum "$CRAFT_PART_INSTALL/usr/sbin/adduser" | cut -d' ' -f1)"
      if [ "$patched_md5" != "430f8d1d23c460e795eb7181c4503365" ]; then
        echo "patched adduser md5 $patched_md5 != expected 430f8d1d23c460e795eb7181c4503365" \
             "(the live-validated fat-chain adduser)" >&2
        exit 1
      fi
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      # The deb's stock /etc/adduser.conf has no USE_EXTRAUSERS setting;
      # the snap ships the live-validated config via the adduser-conf part.
      - -etc/adduser.conf

  policy:
    plugin: nil
    # source: fingerprinted input — snapcraft skips 'already ran' builds
    # when it cannot see the part's real inputs (CRAFT_PROJECT_DIR reads
    # are invisible to the lifecycle otherwise; this bit us as a stale
    # guard binary shipped in a 'successful' build).
    source: polkit
    after:
      - accountsservice
    override-build: |
      install -Dm644 \
        "${CRAFT_PROJECT_DIR}/polkit/org.freedesktop.accounts.policy" \
        "${CRAFT_PART_INSTALL}/meta/polkit/polkit.org.freedesktop.accounts.policy"

  # adduser's extrausers switch: the daemon execs adduser without
  # --extrausers and relies on the config file's USE_EXTRAUSERS=1 to route
  # account creation into /var/lib/extrausers. This is the live-validated
  # config the fat base shipped (served into the daemon's namespace by the
  # /etc/adduser.conf layout bind-file). The accountsservice part excludes
  # the deb's stock config (no USE_EXTRAUSERS there).
  adduser-conf:
    plugin: nil
    source: conf
    override-build: |
      install -Dm644 "${CRAFT_PROJECT_DIR}/conf/adduser.conf" \
        "${CRAFT_PART_INSTALL}/etc/adduser.conf"

  chpasswd-guard:
    plugin: nil
    source: chpasswd
    build-packages:
      - gcc
      - libc6-dev
    override-build: |
      # chpasswd.real must be the fat base's 1017 extrausers-fallback chpasswd
      # (the same binary the variant rootfs bakes at
      # variants/desktop/static/usr/sbin/chpasswd); refuse to pack anything
      # else — a stock chpasswd would break SetPassword on the RO base.
      #
      # The 1017 patch is arch-independent C (chpasswd.c: on failure to lock
      # /etc/passwd — read-only on the image — fall back to the
      # /var/lib/extrausers/{passwd,shadow} db when it exists), but the ELF
      # is arch-specific, so each architecture ships its own build of the
      # same patched source:
      # - amd64: the ucd-ppa passwd_4.17.4-2ubuntu3+ucd1 deb output (the
      #   byte-identical fat-chain binary, md5 91b60d39a7ff16ce2fa2a34da7440ff6).
      # - arm64: cross-built from the same ucd-ppa source tree (resolute
      #   shadow 4.17.4 + the debian patch series + 1017) with
      #   aarch64-linux-gnu-gcc against resolute arm64 debs, configured with
      #   the deb's flags (--with-libpam --with-yescrypt --with-audit
      #   --with-selinux ...), LTO + dpkg-buildflags, --as-needed-symbol
      #   resolution matching the deb (arc4random_buf/reallocarray from
      #   glibc >= 2.36, NOT libbsd — libbsd is not in the runtime base).
      #   Verified end-to-end under qemu-user: /etc lock failure (RO base)
      #   -> 1017 fallback -> password written to
      #   /var/lib/extrausers/shadow, /etc/shadow untouched.
      #   md5 c459c70501c6e2e403491f2f48d7dfb3.
      arch="$(dpkg --print-architecture)"
      case "$arch" in
        amd64)
          expected=91b60d39a7ff16ce2fa2a34da7440ff6
          real="chpasswd.real"
          ;;
        arm64)
          expected=c459c70501c6e2e403491f2f48d7dfb3
          real="chpasswd.real-arm64"
          ;;
        *)
          echo "unsupported build architecture: $arch" >&2
          exit 1
          ;;
      esac
      actual="$(md5sum "${CRAFT_PROJECT_DIR}/chpasswd/$real" | cut -d' ' -f1)"
      if [ "$actual" != "$expected" ]; then
        echo "$real md5 $actual != expected $expected" \
             "(1017-patched chpasswd required for $arch)" >&2
        exit 1
      fi
      mkdir -p "${CRAFT_PART_INSTALL}/usr/sbin"
      cc -O2 -Wall -Wextra \
        -o "${CRAFT_PART_INSTALL}/usr/sbin/chpasswd" \
        "${CRAFT_PROJECT_DIR}/chpasswd/chpasswd-guard.c"
      install -Dm755 "${CRAFT_PROJECT_DIR}/chpasswd/$real" \
        "${CRAFT_PART_INSTALL}/usr/sbin/chpasswd.real"
